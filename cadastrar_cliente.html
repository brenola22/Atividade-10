<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="assets/css/cadastrar_cliente.css">
</head>
<body>

    <div class="logo">
        <img src="assets/images/mannel.png" alt="Imagem da logo">
    </div>

    <div class="container">
        <div class="card">
            
           
            

                <div class="nome">
                    <label for="nome_completo">NOME COMPLETO</label>
                    <input 
                        type="text" 
                        name="nome_completo" 
                        id="nome_completo" 
                        placeholder="Digite seu nome completo" 
                        required
                    >

                    <label for="email">E-MAIL</label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email" 
                        placeholder="Exemplo@email.com" 
                        required
                    >

                    <label for="senha">SENHA</label>
                    <input 
                        type="password" 
                        name="senha" 
                        id="senha" 
                        placeholder="Digite sua senha" 
                        minlength="8"
                        required
                    >

                    <label for="confirmar_senha">CONFIRMAR SENHA</label>
                    <input 
                        type="password" 
                        name="confirmar_senha" 
                        id="confirmar_senha" 
                        placeholder="Confirme sua senha" 
                        minlength="8"
                        required
                    >

                    <label for="telefone">TELEFONE</label>
                    <input 
                        type="tel" 
                        name="telefone" 
                        id="telefone" 
                        placeholder="(DDD) Telefone" 
                        required
                    >
                </div>

                <div class="cep">
                    <label for="cep">ENDEREÇO</label>
                    <input 
                        type="text" 
                        name="cep" 
                        id="cep" 
                        placeholder="CEP" 
                        required
                    >

                    <input 
                        type="text" 
                        name="logradouro" 
                        id="logradouro" 
                        placeholder="Logradouro" 
                        required
                    >

                    <input 
                        type="text" 
                        name="numero" 
                        id="numero" 
                        placeholder="Número" 
                        required
                    >

                    <input 
                        type="text" 
                        name="complemento" 
                        id="complemento" 
                        placeholder="Complemento"
                    >

                    <input 
                        type="text" 
                        name="bairro" 
                        id="bairro" 
                        placeholder="Bairro" 
                        required
                    >

                    <input 
                        type="text" 
                        name="cidade" 
                        id="cidade" 
                        placeholder="Cidade" 
                        required
                    >
                </div>

                <div class="termos">
                    <input 
                        type="checkbox" 
                        name="termos_de_uso" 
                        id="termos_de_uso"
                        required
                    >
                    <label for="termos_de_uso">ACEITO OS TERMOS DE USO</label>
                </div>

                <a href="processa_cadastro.html"><button type="submit">CADASTRAR</button></a>

            

        </div>
    </div>

</body>
</html>
