<head>

    <link rel="stylesheet" href="assets/css/esqueci_senha.css">
    <title>Esqueci minha senha</title>
</head>
<body>
    <div class="container">
        <form action="index.html" method="get"></form>
    
        
        <div class="card">
            <h3>Redefina a sua senha</h3><br><br>
            <label for="e_mail">DIGITE SEU E-MAIL</label><br>
            <input type="email" name="e_mail" id="e_mail" placeholder="67" required><br><br>

            <label for="senha_nova">DIGITE SUA SENHA NOVA</label><br>
            <input type="text" name="senha_nova" id="senha_nova" placeholder="22157" required><br><br>

            <label for="senha_nova">CONFIRME A SENHA</label><br>
            <input type="password" name="senha_nova" id="senha_nova" placeholder="22157" required><br><br>

            <a href="index.html"><button id="btn">REDEFINIR</button></a>
        </div>

    </div>
